name: tools

on:
  push:
    paths: ["tools/**", "examples/**", "firmware/**", "docs/pe_isa.md", "src/pe_*.v", "test/pe/**",
            ".github/workflows/tools.yaml"]
  pull_request:
  workflow_dispatch:

jobs:
  peemu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r tools/requirements.txt
      - name: Golden model, assembler and protocol tests
        run: python -m pytest tools/tests -q
      - name: Assemble every example
        run: |
          cd tools
          for f in ../examples/pe/*.pe; do python -m peemu asm "$f" -f c > /dev/null; done

  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r firmware/requirements.txt
      - name: Rebuild firmware images and check they match the committed ones
        run: |
          python3 firmware/build.py
          git diff --exit-code firmware/images

  pe_lockstep:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install tools
        run: |
          pip install -r test/requirements.txt
          sudo apt-get update && sudo apt-get install -y iverilog
      - name: PE RTL in lockstep with the golden model (random + serial-assist programs)
        run: |
          cd test/pe
          make SEEDS=0:60 CYCLES=1000
          ! grep -q "<failure" results.xml
