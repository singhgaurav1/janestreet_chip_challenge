# Tiny Tapeout project information
project:
  title:        "Protocol Emulator: Ibex + Protocol Engines"      # Project title
  author:       "singhgaurav1"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Reprogrammable protocol emulator: RISC-V Ibex control plane plus cycle-exact protocol engines"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     60000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 202x155 uM.
  tiles: "8x4"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2, 8x2, 3x4, 4x4, 5x4, 6x4 or 8x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_singhgaurav1_protoemu"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "pemu_soc.v"
    - "pemu_host_spi.v"
    - "pemu_bus.v"
    - "pemu_sram.v"
    - "pemu_sysctrl.v"
    - "pemu_cells.v"
    - "ibex_small.v"
    - "sram_bb.v"
    - "pe_block.v"
    - "pe_engine.v"
    - "pe_fifo.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "GPIO in 0"
  ui[1]: "GPIO in 1"
  ui[2]: "GPIO in 2"
  ui[3]: "GPIO in 3"
  ui[4]: "GPIO in 4"
  ui[5]: "HOST_MOSI"
  ui[6]: "HOST_CS_N"
  ui[7]: "HOST_SCK"

  # Outputs
  uo[0]: "GPIO out 0"
  uo[1]: "GPIO out 1"
  uo[2]: "GPIO out 2"
  uo[3]: "GPIO out 3"
  uo[4]: "GPIO out 4"
  uo[5]: "GPIO out 5"
  uo[6]: "GPIO out 6"
  uo[7]: "HOST_MISO"

  # Bidirectional pins
  uio[0]: "GPIO 0"
  uio[1]: "GPIO 1"
  uio[2]: "GPIO 2"
  uio[3]: "GPIO 3"
  uio[4]: "GPIO 4"
  uio[5]: "GPIO 5"
  uio[6]: "GPIO 6"
  uio[7]: "GPIO 7"

# Do not change!
yaml_version: 6
